<svg xmlns="http://www.w3.org/2000/svg" width="480" height="286" viewBox="0 0 480 286" role="img" aria-labelledby="title desc"><title id="title">Measured CI build time reduced by 75 percent</title><desc id="desc">At Signal Advisors, the NX-to-Turborepo migration and CI improvements reduced the measured build step from 20 minutes to 5 minutes across a 27-person engineering organization.</desc><style>
:root{--ink:#1f2933;--muted:#526573;--accent:#267562;--line:#c7d7d7;--soft:#edf5f2;--track:#dde7e7}
@media(prefers-color-scheme:dark){:root{--ink:#edf3f3;--muted:#a4bac3;--accent:#a2dfca;--line:#425761;--soft:#253c3d;--track:#3b5059}}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.line{stroke:var(--line)}.soft{fill:var(--soft)}
@keyframes breathe{0%,100%{opacity:.2}50%{opacity:.65}}.present{animation:breathe 3.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.present{animation:none}}
</style>
<rect width="480" height="286" rx="8" class="soft"/>
<text x="24" y="31" font-size="13" letter-spacing="1" class="mono muted">SIGNAL / MONOREPO MODERNIZATION</text>
<text x="24" y="96" font-size="58" font-weight="600" letter-spacing="-2" class="accent">−75%</text><text x="219" y="77" font-size="19">measured</text><text x="219" y="101" font-size="19">CI build time</text>
<text x="24" y="145" font-size="17" class="muted">Before</text><rect x="101" y="128" width="268" height="22" rx="3" fill="var(--track)"/><text x="386" y="145" font-size="18">20 min</text>
<text x="24" y="187" font-size="17" class="muted">After</text><rect x="101" y="170" width="67" height="22" rx="3" fill="var(--accent)"/><text x="184" y="187" font-size="18" font-weight="600">5 min</text>
<path d="M24 216H456" class="line"/><text x="24" y="241" font-size="15" class="muted">NX → Turborepo + CI improvements</text><text x="24" y="266" font-size="15" class="muted">27-person engineering organization</text></svg>
