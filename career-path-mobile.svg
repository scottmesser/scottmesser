<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title desc"><title id="title">Career at a glance</title><desc id="desc">Ford in 2016, Bluewater in 2018, Nerdy Bunny in 2019, Signal Advisors from April 2020 to present, with Bread Factory Studios concurrently from January 2020.</desc><style>
