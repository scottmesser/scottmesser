<svg xmlns="http://www.w3.org/2000/svg" width="960" height="244" viewBox="0 0 960 244" role="img" aria-labelledby="title desc"><title id="title">Career at a glance</title><desc id="desc">Ford, iOS developer, 2016. Bluewater, mobile developer, 2018. Nerdy Bunny, senior software engineer, 2019. Signal Advisors, senior software engineer, April 2020 to present. Bread Factory Studios, co-founder, January 2020 to present, a concurrent practice.</desc><style>
