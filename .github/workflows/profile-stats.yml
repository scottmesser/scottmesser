name: Refresh GitHub activity

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update-stats.py'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: read

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render public contribution counts
        run: python3 update-stats.py
      - name: Save refreshed activity card
        run: |
          if git diff --quiet -- github-activity.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-activity.svg
          git commit -m 'Refresh public GitHub activity'
          git push
