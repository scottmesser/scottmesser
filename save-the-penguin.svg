    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <g id="fish"><path d="M-15 0C-7-13 7-13 17 0C7 13-7 13-15 0Z" fill="#ffc857"/><path d="M-15 0L-27-11V11Z" fill="#eaa743"/><circle cx="8" cy="-2" r="2" fill="#07131b"/><path d="M-7-4L-1-7" stroke="#fff0c1" stroke-width="2" stroke-linecap="round"/></g>
