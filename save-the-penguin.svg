<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Save the Penguin — play Scott Messer's arcade remake</title>
  <desc id="desc">A small penguin balances on a luminous ice platform above a midnight ocean, surrounded by descending sharks, golden fish, distant mountains, and an arctic aurora. Tilt the ice, dodge the sharks, and collect fish.</desc>
  <style>@keyframes drift{to{transform:translateY(9px)}}.floating{animation:drift 3s ease-in-out infinite alternate;transform-box:fill-box}@media(prefers-reduced-motion:reduce){.floating{animation:none}}</style><defs>
    <linearGradient id="sky" x1="600" y1="0" x2="600" y2="620" gradientUnits="userSpaceOnUse"><stop stop-color="#07131b"/><stop offset=".65" stop-color="#0d2933"/><stop offset="1" stop-color="#103943"/></linearGradient>
    <linearGradient id="ice" x1="730" y1="440" x2="730" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#d9fff6"/><stop offset=".3" stop-color="#a9eee5"/><stop offset="1" stop-color="#3caaa8"/></linearGradient>
    <linearGradient id="aurora" x1="503" y1="-50" x2="1100" y2="330" gradientUnits="userSpaceOnUse"><stop stop-color="#62d77b" stop-opacity="0"/><stop offset=".47" stop-color="#62d77b" stop-opacity=".16"/><stop offset=".8" stop-color="#a9eee5" stop-opacity=".07"/><stop offset="1" stop-color="#a9eee5" stop-opacity="0"/></linearGradient>
