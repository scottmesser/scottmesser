  <text x="56" y="361" fill="#d5eee9" font-family="Arial, Helvetica, sans-serif" font-size="23">Tilt the ice. Dodge the sharks.</text>
  <text x="56" y="392" fill="#82a8ac" font-family="Arial, Helvetica, sans-serif" font-size="17">Keep one small penguin out of very deep trouble.</text>

