    <text x="75" y="43" fill="#a9eee5" font-size="12" letter-spacing="1.6">SCOTT MESSER / ENGINEERING PLAYGROUND</text>
    <text x="1144" y="43" text-anchor="end" fill="#6b969c" font-size="11" letter-spacing="1.2">EST. 2015 → REBUILT</text>
    <text x="56" y="113" fill="#ffc857" font-size="12" letter-spacing="2.5">SMALL PENGUIN. BIG PROBLEM.</text>
  </g>
