<svg xmlns="http://www.w3.org/2000/svg" width="480" height="206" viewBox="0 0 480 206" role="img" aria-labelledby="title desc"><title id="title">Scott Messer — Senior Software Engineer</title><desc id="desc">Frontend architecture, design systems and developer experience. Denver, Colorado.</desc><style>
:root{--ink:#1f2933;--muted:#526573;--accent:#267562;--line:#c7d7d7;--soft:#edf5f2;--track:#dde7e7}
@media(prefers-color-scheme:dark){:root{--ink:#edf3f3;--muted:#a4bac3;--accent:#a2dfca;--line:#425761;--soft:#253c3d;--track:#3b5059}}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.line{stroke:var(--line)}.soft{fill:var(--soft)}
@keyframes breathe{0%,100%{opacity:.2}50%{opacity:.65}}.present{animation:breathe 3.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.present{animation:none}}
</style>
